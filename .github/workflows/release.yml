name: Release Helm Chart

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CHARTS_REPO: daichi703n/charts
  CHARTS_DIR: stable
  PAGES_BASE_URL: https://daichi703n.github.io/charts/stable

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4

      # Chart.yaml の version と Git tag (v を除去) の一致を検証。
      # 不一致ならここで fail させ、意図しないリリースを防ぐ。
      - name: Verify chart version matches tag
        shell: bash
        run: |
          set -euo pipefail
          chart_version="$(awk '/^version:/ {print $2; exit}' Chart.yaml)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Chart version: ${chart_version}"
          echo "Tag version:   ${tag_version}"
          if [ "${chart_version}" != "${tag_version}" ]; then
            echo "ERROR: Chart.yaml version (${chart_version}) does not match Git tag (${tag_version})."
            exit 1
          fi

      - name: Helm lint
        run: helm lint .

      - name: Helm template
        run: helm template test .

      - name: Package chart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package . --destination dist
          ls -l dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # --generate-notes は過去 Release が無いと失敗し得るため、失敗時はノート無しで再試行。
          if ! gh release create "${GITHUB_REF_NAME}" \
                dist/*.tgz \
                --title "${GITHUB_REF_NAME}" \
                --generate-notes; then
            echo "generate-notes failed; retrying without notes."
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.tgz \
              --title "${GITHUB_REF_NAME}"
          fi

      # 公開先は elastalert-helm の gh-pages ではなく、別リポジトリ daichi703n/charts。
      # 専用トークンで checkout / push する。
      - name: Checkout charts repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CHARTS_REPO }}
          ref: gh-pages
          token: ${{ secrets.ELASTALERT_CHARTS_PUSH_TOKEN }}
          path: charts

      # 既存 index.yaml を壊さないため helm repo index --merge を使用。
      # 既存エントリは urls が相対ファイル名なので --url は付けない。
      - name: Update Helm repository index
        shell: bash
        run: |
          set -euo pipefail
          cp dist/*.tgz "charts/${CHARTS_DIR}/"
          cd "charts/${CHARTS_DIR}"
          helm repo index --merge index.yaml .
          git --no-pager diff -- index.yaml || true

      - name: Publish to Helm repository
        working-directory: charts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${CHARTS_DIR}/"
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Release elastalert ${GITHUB_REF_NAME}"
          git push origin gh-pages

      # praeco-helm の dependency update ワークフローを起動する。
      - name: Notify praeco-helm
        env:
          GH_TOKEN: ${{ secrets.PRAECO_HELM_DISPATCH_TOKEN }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          gh api \
            --method POST \
            "/repos/daichi703n/praeco-helm/dispatches" \
            -f event_type=elastalert-release \
            -f "client_payload[version]=${version}"
